<body>
    <h1>round</h1>
    <pre>
        SQL에서 ROUND() 함수는 숫자를 반올림할 때
        사용하는 내장 함수입니다.
        지정한 자릿수까지 숫자를 남기고,
        그 아래 자릿수에서
        반올림(5 이상은 올림, 5 미만은 버림)을 수행합니다.
        기본 문법sql
        ROUND(숫자, 자릿수)
    </pre>
</body>
